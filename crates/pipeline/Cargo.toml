[package]
name = "pipeline"
version = "0.1.0"
edition = "2024"
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
capture = { path = "../capture" }
encode = { path = "../encode" }
input = { path = "../input" }
net = { path = "../net" }
tokio = { version = "1", features = ["sync", "rt-multi-thread", "macros", "time"] }
tracing = "0.1"
serde_json = "1"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
