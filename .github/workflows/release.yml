name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-24.04
            args: ""
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-platform

      - uses: denoland/setup-deno@v2

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: host-app/src-tauri -> target

      - name: Install frontend dependencies
        run: deno install

      # macOS code signing — opt-in via secrets.
      #   Required: APPLE_CERTIFICATE (base64 .p12), APPLE_CERTIFICATE_PASSWORD,
      #             APPLE_SIGNING_IDENTITY (cert common name)
      #   Notarization (paid Developer Program):
      #             APPLE_ID, APPLE_PASSWORD (app-specific), APPLE_TEAM_ID
      # A free "Apple Development" cert is enough to verify the pipeline end-to-end;
      # Gatekeeper will still warn other users. Swap to a "Developer ID Application"
      # cert + add the notarization secrets to ship signed-and-notarized builds.
      - name: Import Apple certificate
        if: matrix.platform == 'macos-latest'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "APPLE_CERTIFICATE is not configured; skipping certificate import."
            exit 0
          fi

          CERTIFICATE_PATH=$RUNNER_TEMP/certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          echo -n "$APPLE_CERTIFICATE" | base64 --decode -o $CERTIFICATE_PATH

          security create-keychain -p "" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "" $KEYCHAIN_PATH

          security import $CERTIFICATE_PATH -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

      - name: Configure Apple notarization
        if: matrix.platform == 'macos-latest'
        env:
          NOTARIZATION_APPLE_ID: ${{ secrets.APPLE_ID }}
          NOTARIZATION_APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          NOTARIZATION_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$NOTARIZATION_APPLE_ID" ] || [ -z "$NOTARIZATION_APPLE_PASSWORD" ] || [ -z "$NOTARIZATION_APPLE_TEAM_ID" ]; then
            echo "Apple notarization credentials are incomplete; building a signed, unnotarized app."
            exit 0
          fi

          echo "APPLE_ID=$NOTARIZATION_APPLE_ID" >> "$GITHUB_ENV"
          echo "APPLE_PASSWORD=$NOTARIZATION_APPLE_PASSWORD" >> "$GITHUB_ENV"
          echo "APPLE_TEAM_ID=$NOTARIZATION_APPLE_TEAM_ID" >> "$GITHUB_ENV"

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ matrix.platform == 'macos-latest' && secrets.APPLE_SIGNING_IDENTITY || '' }}
        with:
          projectPath: host-app
          tagName: v__VERSION__
          releaseName: "Sidecar v__VERSION__"
          releaseBody: "Download the installer for your platform from the assets below."
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}

      # Tauri notarizes and staples the app before creating the DMG. Submit the
      # final signed DMG separately so Gatekeeper also accepts the download
      # container itself, then replace the asset uploaded by tauri-action.
      - name: Notarize macOS disk image
        if: matrix.platform == 'macos-latest'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOTARIZATION_APPLE_ID: ${{ secrets.APPLE_ID }}
          NOTARIZATION_APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          NOTARIZATION_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          shopt -s nullglob
          DMG_FILES=(target/aarch64-apple-darwin/release/bundle/dmg/*.dmg)
          test "${#DMG_FILES[@]}" -eq 1
          DMG_PATH="${DMG_FILES[0]}"

          xcrun notarytool submit "$DMG_PATH" \
            --apple-id "$NOTARIZATION_APPLE_ID" \
            --password "$NOTARIZATION_APPLE_PASSWORD" \
            --team-id "$NOTARIZATION_APPLE_TEAM_ID" \
            --wait
          xcrun stapler staple "$DMG_PATH"
          xcrun stapler validate "$DMG_PATH"
          spctl --assess --type open --context context:primary-signature --verbose=4 "$DMG_PATH"
          gh release upload "${{ github.ref_name }}" "$DMG_PATH" --clobber

      - name: Build sidecar CLI
        if: matrix.platform == 'ubuntu-24.04'
        run: cargo build --release -p sidecar-cli

      - name: Package CLI binary
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          cp LICENSE target/release/
          cd target/release
          tar czf sidecar-cli-linux-x86_64.tar.gz sidecar LICENSE

      - name: Upload CLI to release
        if: matrix.platform == 'ubuntu-24.04'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" target/release/sidecar-cli-linux-x86_64.tar.gz

  publish:
    name: Validate updater and publish release
    needs: release
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Validate updater manifest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p "$RUNNER_TEMP/updater"
          gh release download "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --pattern latest.json \
            --dir "$RUNNER_TEMP/updater"

          jq --exit-status --arg version "${GITHUB_REF_NAME#v}" '
            .version == $version and
            (.platforms | has("darwin-aarch64")) and
            (.platforms | has("linux-x86_64")) and
            (.platforms | has("windows-x86_64")) and
            all(.platforms[]; (.signature | length > 0) and (.url | startswith("https://")))
          ' "$RUNNER_TEMP/updater/latest.json"

      - name: Publish GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --draft=false

      - name: Verify public updater endpoint
        run: |
          curl --fail --location --retry 5 --retry-all-errors \
            "https://github.com/${{ github.repository }}/releases/latest/download/latest.json" \
            --output "$RUNNER_TEMP/latest.json"
          jq --exit-status --arg version "${GITHUB_REF_NAME#v}" \
            '.version == $version' "$RUNNER_TEMP/latest.json"
