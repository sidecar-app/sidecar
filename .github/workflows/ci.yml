name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-platform

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: denoland/setup-deno@v2

      - name: Install frontend dependencies
        run: deno install

      - name: Check frontend formatting
        run: deno fmt --check

      - name: Lint frontend
        run: deno lint

      - name: Check Rust formatting
        working-directory: host-app/src-tauri
        run: cargo fmt --all --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Type check frontend
        working-directory: host-app
        run: deno run -A npm:typescript/tsc --noEmit

  test:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-platform

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: host-app/src-tauri -> target

      - name: Run tests
        working-directory: host-app/src-tauri
        run: cargo test --workspace --profile ci

  build:
    needs: [lint]
    strategy:
      fail-fast: false
      matrix:
        include:
          # Matches the release runner (see release.yml), so the oldest FFmpeg
          # and glibc we ship against are still built on every push, while
          # lint/test cover the newer 26.04 stack.
          - platform: ubuntu-24.04
            rust-targets: ""
          - platform: macos-latest
            rust-targets: "aarch64-apple-darwin"
          - platform: windows-latest
            rust-targets: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-platform

      - uses: denoland/setup-deno@v2

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: host-app/src-tauri -> target

      - name: Install frontend dependencies
        run: deno install

      - name: Build frontend
        working-directory: host-app
        run: deno task build

      - name: Build Rust app (no packaging)
        working-directory: host-app/src-tauri
        run: cargo build --profile ci
